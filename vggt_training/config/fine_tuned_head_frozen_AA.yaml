experiment:
  name: "bf16_min_loss_reloc3r_multi-datasets_frozen_aa_head_from_scratch_wo_automask_geo0.001_smooth0.001_pose0.1_exr1_dispw"
  seed: 15
  debug: false

train:
  # epochs: 50
  max_steps: 300_000
  ckpt_every_n_train_steps: 5_000
  batch_size: 8
  workers: 6
  prefetch_factor: 4
  pin_memory: False
  resume_path: null
  load_weights_path: null

defaults:
  - default_dataset.yaml

img_size: 518
num_workers: 2
patch_size: 14
max_img_per_gpu: 8
num_batches_epoch_train: 20_000
num_batches_epoch_val: 1_000


data:
  ## for sequatial dataset
  data_path: "storage/nuscenes_original_size"      # corresponds to positional `data` argument
  dataset: "nuscenes"
  folder_type: "sequence"
  sequence_length: 5
  skip_frames: 1
  target_size: [294, 518]
  no_aug: False

  ## for multi-dataset
  # The code for data still looks too complicated. I should refactor this again (do I have time?...)
  train:
    _target_: vggt_training.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    num_batches_epoch: null
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
    dataset:
      _target_: vggt_training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: vggt_training.data.datasets.waymo.WaymoDataset
          split: train
          Waymo_DIR: storage/waymo_original_size
          expand_rate: 1
          len_train: 500_0000
        - _target_: vggt_training.data.datasets.nusc.nuScenesDataset
          split: train
          nuscenes_DIR: storage/nuscenes_original_size
          expand_rate: 1
          len_train: 500_0000
        - _target_: vggt_training.data.datasets.kitti_odometry.KittiOdometryDataset
          split: train
          KittiOdometry_DIR: storage/kitti_odometry
          expand_rate: 1
          len_train: 500_0000


  val:
    _target_: vggt_training.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    num_batches_epoch: null
    is_training: False
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
    dataset:
      _target_: vggt_training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: vggt_training.data.datasets.waymo.WaymoDataset
          split: test
          Waymo_DIR: storage/waymo_original_size
          len_test: 10_000
        - _target_: vggt_training.data.datasets.kitti_odometry.KittiOdometryDataset
          split: test
          KittiOdometry_DIR: storage/kitti_odometry
          len_test: 10_000
        - _target_: vggt_training.data.datasets.nusc.nuScenesDataset
          split: test
          nuscenes_DIR: storage/nuscenes_original_size
          len_test: 10_000

loss:
  number_sampled_pairs: 4
  photo_loss_weight: 1.0
  smooth_loss_weight: 0.001
  geometry_consistency_weight: 0.001
  poses_consistency_weight: 0.1
  with_ssim: 1
  with_mask: 0
  with_auto_mask: 0
  padding_mode: "zeros"
  mode: "bilinear" # "bilinear" #"bicubic"
  photometric_clamp_min: -5
  with_gt_intrinsic: True
  geo:
    linear_down_sampling: True
    detach: True
  uncertainty:  
    type: pair-wise # option: null, we don't use uncertainty; pair-wise; non-pair-wise
    CoProU: True # true or false to switch CoProU
  per_pixel_min: true
  disp_weighting: True

model:
  vggt:
    enable_camera: False
    enable_point: False
    enable_depth: False
    enable_track: False
    model_type: 'vitl' # VGGT default is vitl

  depth_head:
    activation_type: "linear_inv_sigmoid_depth"
  
  camera_head:
    pose_encoding_type: "absT_Euler"
    coefficient_pose: 0.1  
    type: reloc3r # reloc3r # reloc3r # if use vggt original, pls enter null

optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.0000

  load_vggt_pretrained_modules:     # if load_vggt_pretrained_modules are none, we will load dinov2
    - "*aggregator*"
    # - "*depth*"
    # - "*camera*"

  frozen_module_names:
      - "*aggregator*"  # example, freeze the aggregator
      # - "*depth*"
      # - "*patch_embed*"

  amp:
    enabled: True
    precision: bf16-mixed # 32-true # 32-true # bf16-mixed 
    amp_dtype: bfloat16 ## VGGT uses this, keeping here for record.
  gradient_clip:
    _target_: vggt_training.train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 10   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 20   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 20   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["uncertainty"]
        max_norm: 20   # feel free to reduce this if you see instabilities
        norm_type: 2  
  options:
    lr:
      - param_names: ["model**"] 
        scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-5
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
      - param_names: ["uncertainty_head**"]
        scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-5
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
      - param_names: ["depth_head**"]
        scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-5
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
      - param_names: ["camera_head**"]
        scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-5
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0000